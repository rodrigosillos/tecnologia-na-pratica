name: tnp-catalogo

services:
  catalogo:
    image: tnp-catalogo:1.5
    build:
      context: ./catalogo-estudos
      target: execucao
    pull_policy: never
    env_file:
      - ./catalogo-estudos/.env.cap08
    volumes:
      - type: volume
        source: dados
        target: /app/dados
    networks:
      - rede
    healthcheck:
      test: ["CMD", "node", "diagnostico.js"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 5s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s
    restart: "no"

  entrada:
    image: tnp-entrada:1.0
    build:
      context: ./entrada
    pull_policy: never
    ports:
      - "127.0.0.1:${TNP_PORTA_HTTP:?Defina TNP_PORTA_HTTP no .env}:8080"
    networks:
      - rede
    depends_on:
      catalogo:
        condition: service_healthy
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
          mode: 01777
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s
    restart: "no"

networks:
  rede:
    driver: bridge

volumes:
  dados:
    external: true
    name: tnp-catalogo-dados
