name: delivery_flutter
description: Delivery demonstrativo com carrinho e confirmação em Flutter.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.11.1
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/fonts/NOTICE.txt
    - assets/fonts/roboto_license.txt
  fonts:
    - family: VoltioSans
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
