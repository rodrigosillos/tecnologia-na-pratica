services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SQL_PRATICA_ADMIN_PASSWORD:?Defina a senha no arquivo .env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sql_pratica_pg18:/var/lib/postgresql
volumes:
  sql_pratica_pg18:
